# Refresh public headlines for the dashboard HOT NEWS panel.
# PAUSED 2026-11-20 11:16 London at Malay's request: the 5-minute schedule is commented out below.
# To re-enable, uncomment the two schedule lines. Manual runs (workflow_dispatch) still work.
# Zero Grok credits: stdlib Python only, rule-based notes, headlines only (no account data).
name: Refresh headlines

on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch public RSS and write data/news.json
        run: python3 scripts/fetch_news.py

      - name: Commit if headlines changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "news.json unchanged"
            exit 0
          fi
          git commit -m "chore: refresh public news.json"
          git push
